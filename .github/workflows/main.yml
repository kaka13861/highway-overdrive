
name: Build Highway Overdrive APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Find and extract game project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          mkdir -p /tmp/highway
          unzip -q "$ZIP_FILE" -d /tmp/highway
          PROJECT="$(find /tmp/highway -name project.godot -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot was not found in the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Game project: $PROJECT_DIR"

      - name: Configure Android export
        shell: bash
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/build"
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/HighwayOverdrive.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.highwayoverdrive.game"
          package/name="Highway Overdrive"
          package/signed=false
          version/code=1
          version/name="1.0"
          screen/immersive_mode=true
          EOF

      - name: Import project resources
        shell: bash
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/HighwayOverdrive.apk"
          test -s "$PROJECT_DIR/build/HighwayOverdrive.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Highway-Overdrive-APK
          path: /tmp/highway/**/build/HighwayOverdrive.apk
          if-no-files-found: error

